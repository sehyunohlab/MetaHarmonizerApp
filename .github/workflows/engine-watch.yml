name: Engine Watch

# Daily check of upstream shbrief/MetaHarmonizer `main` against the commit our
# vendored engine wheel is built from (backend/vendor/ENGINE_REF). When upstream
# has moved, start the Engine Upgrade workflow for that commit: it builds the
# wheel, runs the contract suite and the real-engine smoke, and opens a PR.
#
# Each upstream commit gets one automatic attempt. A failed attempt opens an
# issue and is retried only when upstream moves again (or when started by hand).

on:
  schedule:
    - cron: "23 5 * * *" # daily 05:23 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would happen"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write # start the Engine Upgrade workflow
  pull-requests: read

concurrency:
  group: engine-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Compare Upstream Engine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPSTREAM: https://github.com/shbrief/MetaHarmonizer.git
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v5

      - name: Start an upgrade when upstream main has moved
        run: |
          set -euo pipefail
          PINNED=$(grep -v '^#' backend/vendor/ENGINE_REF | head -n1 | tr -d '[:space:]')
          LATEST=$(git ls-remote "$UPSTREAM" refs/heads/main | cut -f1)
          {
            echo "### Upstream engine"
            echo "- pinned: \`${PINNED}\`"
            echo "- upstream main: \`${LATEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$LATEST" ]; then
            echo "::error::Could not read upstream main from $UPSTREAM"
            exit 1
          fi
          if [ "$LATEST" = "$PINNED" ]; then
            echo "- up to date" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          OPEN=$(gh pr list --state open --head "engine-bump/${LATEST:0:12}" --json url --jq '.[0].url // empty')
          if [ -n "$OPEN" ]; then
            echo "- upgrade PR already open: $OPEN" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          TRIED=$(gh run list --workflow engine-bump.yml --limit 100 \
            --json displayTitle,conclusion,url \
            --jq "[.[] | select(.displayTitle == \"Engine Upgrade to ${LATEST}\" and .conclusion != \"cancelled\")][0].url // empty")
          if [ -n "$TRIED" ]; then
            echo "- already attempted: $TRIED" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "- dry run: would start Engine Upgrade to \`${LATEST}\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run engine-bump.yml -f ref="$LATEST" -f auto_merge=false
          echo "- started Engine Upgrade to \`${LATEST}\`" >> "$GITHUB_STEP_SUMMARY"
